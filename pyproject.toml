[project]
name = "shelf-recs"
version = "0.1.0"
description = "A drop-in recommendation API for teams without a data science team."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ali Akbari Alashti" }]
requires-python = ">=3.10"
keywords = ["recommendation-system", "recommender", "fastapi", "collaborative-filtering", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/AliAkbariAlashti/shelf"
Repository = "https://github.com/AliAkbariAlashti/shelf"
Issues = "https://github.com/AliAkbariAlashti/shelf/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
shelf = "shelf.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shelf*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() defaults are the framework's own idiom,
# not the mutable-default footgun this rule guards against.
extend-ignore = ["B008"]
