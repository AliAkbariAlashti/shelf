[project]
name = "shelf-recs"
version = "0.1.0"
description = "A drop-in recommendation API for teams without a data science team."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ali Akbari Alashti" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
shelf = "shelf.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shelf*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() defaults are the framework's own idiom,
# not the mutable-default footgun this rule guards against.
extend-ignore = ["B008"]
